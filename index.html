<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>松烟墨作坊 · 光标叙事</title>
<style>
  :root{
    --ink:#26231e; --paper:#f6f1e3; --seal:#a33327; --dim:rgba(38,35,30,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0f12;}
  body{font-family:"Kaiti SC","STKaiti","KaiTi","Noto Serif SC","Songti SC",serif;color:var(--ink);
       -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  canvas{display:block;}
  body.grab{cursor:pointer;}

  /* ---------- 加载页 ---------- */
  #loader{position:fixed;inset:0;z-index:60;background:#f2ecdd;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:26px;transition:opacity 1s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  #loader .big{font-size:min(11vw,74px);letter-spacing:.22em;color:var(--ink);
    animation:brushIn 1.6s cubic-bezier(.22,.9,.24,1) both;}
  #loader .sub{font-size:13px;letter-spacing:.55em;color:var(--dim);padding-left:.55em;
    animation:fadeUp 1.2s .5s ease both;}
  #loader .seal{width:30px;height:30px;background:var(--seal);color:#f6f1e3;font-size:17px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    box-shadow:0 2px 10px rgba(163,51,39,.4);animation:fadeUp 1s .8s ease both;}
  @keyframes brushIn{0%{opacity:0;transform:scaleX(.1);filter:blur(6px);transform-origin:left;}
    60%{filter:blur(0);}100%{opacity:1;transform:scaleX(1);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  /* ---------- 开卷 · 古籍引入 ---------- */
  #intro{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 42%,rgba(244,238,224,.90),rgba(236,229,211,.96) 80%);
    opacity:0;pointer-events:none;transition:opacity 1.1s ease;}
  #intro.show{opacity:1;pointer-events:auto;}
  #intro.bye{opacity:0;pointer-events:none;}
  #intro.gone{display:none;}
  #intro .cols{display:flex;flex-direction:row-reverse;gap:clamp(16px,3.2vw,42px);
    height:min(62vh,520px);padding:0 5vw;}
  #intro .col{writing-mode:vertical-rl;height:100%;
    font-family:KaiTi,'Kaiti SC','STKaiti',serif;
    font-size:clamp(13px,1.5vw,17px);line-height:2.1;letter-spacing:.3em;color:#2b2a26;
    opacity:0;filter:blur(5px);transform:translateY(16px);}
  #intro.show .col{animation:colIn 1.7s cubic-bezier(.2,.7,.2,1) forwards;}
  #intro.show .col:nth-child(1){animation-delay:.55s;}
  #intro.show .col:nth-child(2){animation-delay:1.25s;}
  #intro.show .col:nth-child(3){animation-delay:1.95s;}
  #intro.show .col:nth-child(4){animation-delay:2.65s;}
  #intro .col .src{color:var(--seal);font-size:.72em;letter-spacing:.42em;padding-top:1.3em;}
  #intro .col.tail{color:rgba(43,42,38,.68);}
  #intro .open{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);
    font-family:inherit;font-size:15px;letter-spacing:.6em;padding:13px 24px 13px calc(24px + .6em);
    color:#f4efe2;background:var(--seal);border:none;border-radius:3px;cursor:pointer;
    box-shadow:0 4px 18px rgba(163,51,39,.4);opacity:0;pointer-events:none;
    transition:opacity .8s ease,transform .25s ease;}
  #intro.show .open{opacity:1;pointer-events:auto;transition-delay:3.3s,0s;}
  #intro .open:hover{transform:translateX(-50%) translateY(-2px);}
  @keyframes colIn{to{opacity:1;filter:blur(0);transform:none;}}
  @media (max-width:640px){ #intro .cols{height:58vh;gap:12px;} }

  /* ---------- 通用浮层 ---------- */
  #vig{position:fixed;inset:0;z-index:5;pointer-events:none;
       background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(16,20,26,.30) 100%);}
  .ui{position:fixed;z-index:10;pointer-events:none;transition:opacity .8s ease;}
  .ui.off{opacity:0;}

  /* 竖排标题 */
  #title{top:36px;left:38px;display:flex;gap:14px;align-items:flex-start;}
  #title .main{writing-mode:vertical-rl;font-size:clamp(26px,4vw,40px);letter-spacing:.34em;
    color:#20242a;text-shadow:0 1px 0 rgba(255,255,255,.35),0 2px 14px rgba(20,30,40,.25);}
  #title .side{writing-mode:vertical-rl;font-size:11px;letter-spacing:.5em;color:rgba(32,36,42,.62);
    padding-top:6px;}
  #title .seal{writing-mode:horizontal-tb;width:26px;height:26px;background:var(--seal);color:#f6f1e3;
    font-size:15px;display:flex;align-items:center;justify-content:center;border-radius:3px;
    align-self:flex-end;margin-top:10px;box-shadow:0 2px 8px rgba(163,51,39,.35);}

  /* 底部提示 */
  #hint{bottom:30px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:.5em;
    padding-left:.5em;color:rgba(30,34,40,.85);text-shadow:0 1px 6px rgba(240,244,248,.9);
    white-space:nowrap;}

  /* 出门按钮 */
  #exitBtn{position:fixed;right:30px;bottom:28px;z-index:12;pointer-events:auto;
    padding:9px 20px;font-family:inherit;font-size:14px;letter-spacing:.4em;padding-left:calc(20px + .4em);
    color:var(--ink);background:rgba(246,241,227,.82);border:1px solid rgba(38,35,30,.5);
    border-radius:2px;cursor:pointer;opacity:0;transform:translateY(8px);transition:all .6s ease;}
  #exitBtn.show{opacity:1;transform:none;}
  #exitBtn:hover{background:var(--ink);color:var(--paper);}

  /* 光标标签 */
  #cursorLabel{position:fixed;z-index:14;pointer-events:none;opacity:0;transition:opacity .25s ease;
    background:rgba(28,26,22,.88);color:#f4efe2;font-size:12px;letter-spacing:.28em;
    padding:8px 14px 8px calc(14px + .28em);border-left:2px solid var(--seal);border-radius:2px;
    transform:translate(16px,14px);white-space:nowrap;}
  #cursorLabel.on{opacity:1;}

  /* 点击墨晕 */
  .ripple{position:fixed;z-index:13;pointer-events:none;width:44px;height:44px;margin:-22px 0 0 -22px;
    border:1px solid rgba(163,51,39,.85);border-radius:50%;animation:rip .7s ease-out forwards;}
  @keyframes rip{from{opacity:.9;transform:scale(.15);}to{opacity:0;transform:scale(1.4);}}

  /* ---------- 工序文牍 ---------- */
  #panel{position:fixed;z-index:20;right:34px;top:50%;width:316px;max-height:78vh;overflow:auto;
    transform:translate(46px,-50%);opacity:0;pointer-events:none;transition:all .7s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(160deg,rgba(248,243,231,.97),rgba(240,233,216,.95));
    border:1px solid rgba(38,35,30,.28);border-left:3px solid var(--ink);
    box-shadow:0 24px 70px rgba(10,14,20,.45);padding:26px 28px 24px;}
  #panel.show{transform:translate(0,-50%);opacity:1;pointer-events:auto;}
  #panel .dots{display:flex;gap:9px;margin-bottom:16px;align-items:center;}
  #panel .dots .nav{background:none;border:none;color:var(--dim);font-size:20px;line-height:1;
    cursor:pointer;padding:0 8px;font-family:inherit;transition:color .25s;}
  #panel .dots .nav:hover{color:var(--seal);}
  #panelDots{display:flex;gap:9px;}
  #panel .dots i{width:9px;height:9px;border:1px solid rgba(38,35,30,.55);border-radius:50%;
    cursor:pointer;transition:all .3s;}
  #panel .dots i.done{background:rgba(38,35,30,.35);}
  #panel .dots i.act{background:var(--seal);border-color:var(--seal);transform:scale(1.25);}
  #panel .num{font-size:13px;letter-spacing:.5em;color:var(--seal);margin-bottom:6px;}
  #panel h2{font-size:25px;letter-spacing:.16em;margin-bottom:4px;font-weight:600;}
  #panel .sub{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:14px;}
  #panel .rule{height:1px;background:linear-gradient(90deg,var(--ink),transparent 80%);
    position:relative;margin-bottom:14px;}
  #panel .rule::after{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;
    background:var(--seal);transform:rotate(45deg);}
  #panel p{font-size:14.5px;line-height:2.05;letter-spacing:.08em;text-align:justify;color:#2c2924;}
  #panel .close{position:absolute;top:14px;right:14px;width:28px;height:28px;border:none;
    background:transparent;font-size:17px;color:var(--dim);cursor:pointer;font-family:inherit;}
  #panel .close:hover{color:var(--seal);}
  /* —— 工序 / 化学视角 双标签 —— */
  #panel .tabs{display:flex;gap:8px;margin:2px 0 14px;}
  #panel .tabs i{flex:1;text-align:center;font-style:normal;font-size:13px;letter-spacing:.28em;
    padding:7px 0 6px;cursor:pointer;color:var(--dim);user-select:none;
    border:1px solid rgba(38,35,30,.22);background:rgba(255,255,255,.25);transition:all .3s;font-family:inherit;}
  #panel .tabs i.on{background:var(--ink);color:#f2ead6;border-color:var(--ink);}
  #panel .tabs i:hover{color:var(--seal);}
  #panel .tabs i.on:hover{color:#f2ead6;}
  #pChem{display:none;}
  #panel.chem #pText{display:none;}
  #panel.chem #pChem{display:block;}
  #pChem .ctag{display:inline-block;font-size:12px;letter-spacing:.3em;padding:3px 12px 2px;border-radius:99px;margin-bottom:12px;}
  #pChem .ctag.c{background:rgba(163,51,39,.12);color:var(--seal);border:1px solid rgba(163,51,39,.5);}
  #pChem .ctag.p{background:rgba(61,107,85,.14);color:#3d6b55;border:1px solid rgba(61,107,85,.5);}
  #pChem .ck{padding:8px 0;border-bottom:1px dashed rgba(38,35,30,.18);font-size:13.5px;line-height:1.9;
    letter-spacing:.05em;text-align:justify;color:#2c2924;}
  #pChem .ck:last-of-type{border-bottom:none;}
  #pChem .ck b{color:var(--seal);}
  #pChem .eq{margin:12px 0 4px;padding:12px 10px;text-align:center;background:rgba(38,35,30,.05);
    border:1px solid rgba(38,35,30,.16);border-radius:8px;font-size:16px;letter-spacing:.08em;color:#2c2924;}
  #pChem .eq .cond{font-size:11px;color:var(--seal);border:1px solid rgba(163,51,39,.5);border-radius:5px;padding:0 5px;margin:0 4px;}
  #pChem .eq small{display:block;font-size:11.5px;color:#6b6455;margin-top:6px;letter-spacing:.1em;}
  #pChem .labBtn{display:block;width:100%;margin-top:12px;padding:10px 0;background:var(--seal);color:#f5efdd;
    border:none;border-radius:8px;font-family:inherit;font-size:14px;letter-spacing:.4em;text-indent:.4em;cursor:pointer;transition:background .3s;}
  #pChem .labBtn:hover{background:#8e2d1f;}
  /* —— 燃烧实验台覆盖层 —— */
  #chemLab{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(20,16,12,.55);backdrop-filter:blur(6px);}
  #chemLab.open{display:flex;}
  #chemLab .box{width:min(680px,92vw);max-height:90vh;overflow:auto;position:relative;
    background:linear-gradient(160deg,#f8f3e7,#f0e9d8);border:1px solid rgba(38,35,30,.3);border-left:3px solid var(--seal);
    box-shadow:0 30px 90px rgba(0,0,0,.5);padding:20px 22px;}
  #chemLab h3{font-size:19px;letter-spacing:.2em;color:#2b2721;margin-bottom:2px;}
  #chemLab .lsub{font-size:12px;color:#6b6455;letter-spacing:.2em;margin-bottom:12px;}
  #chemLab canvas{width:100%;border-radius:8px;background:#181510;display:block;}
  #chemLab .air{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:#2c2924;}
  #chemLab .air input{flex:1;accent-color:var(--seal);}
  #chemLab .eqv{margin-top:12px;text-align:center;font-size:17px;letter-spacing:.06em;padding:10px 8px;
    background:rgba(38,35,30,.05);border:1px solid rgba(38,35,30,.16);border-radius:8px;color:#2c2924;}
  #chemLab .eqv .cond{font-size:11px;color:var(--seal);border:1px solid rgba(163,51,39,.5);border-radius:5px;padding:0 5px;margin:0 4px;}
  #chemLab .eqv small{display:block;font-size:12px;color:#6b6455;margin-top:5px;line-height:1.8;}
  #chemLab .close{position:absolute;top:10px;right:12px;border:none;background:transparent;font-size:18px;color:#6b6455;cursor:pointer;font-family:inherit;}
  #chemLab .close:hover{color:var(--seal);}

  @media (max-width:680px){
    #panel{left:0;right:0;top:auto;bottom:0;width:100%;max-height:52vh;
      transform:translate(0,110%);border-left:none;border-top:3px solid var(--ink);}
    #panel.show{transform:translate(0,0);}
    #title{top:20px;left:20px;}
    #hint{font-size:11px;bottom:22px;}
    #exitBtn{right:16px;bottom:16px;}
  }
</style>
</head>
<body>

<div id="loader">
  <div class="big">松烟墨作坊</div>
  <div class="sub">光标叙事 · 制墨六序</div>
  <div class="seal">墨</div>
</div>

<!-- 开卷 · 古籍引入 -->
<div id="intro">
  <div class="cols">
    <div class="col">古墨惟以松烟为之，曹子建诗：「墨出青松烟」。<span class="src">——《洞天墨录》</span></div>
    <div class="col">其墨取庐山产松烟，代郡之鹿胶，十年以上强如石者为之。<span class="src">——卫夫人《笔阵图》</span></div>
    <div class="col">余尝谓松烟墨深重而不姿媚，油烟墨姿媚而不深重。<span class="src">——屠隆《考盘余事》</span></div>
    <div class="col tail">松烟墨入水易化，宜画人物须眉、翎毛和蝶翅等。</div>
  </div>
  <button class="open" id="openBtn">启 卷</button>
</div>

<div id="vig"></div>
<div id="title" class="ui off">
  <div class="main">松烟墨作坊</div>
  <div class="side">PINE SOOT INK ATELIER</div>
  <div class="seal">墨</div>
</div>
<div id="hint" class="ui off">移动光标 · 环视松谷　　点击门扉 · 入内观墨</div>
<button id="exitBtn">出 门</button>
<div id="cursorLabel"></div>

<div id="panel">
  <button class="close" id="panelClose">✕</button>
  <div class="dots">
    <button class="nav" id="pPrev" title="上一序">‹</button>
    <div id="panelDots"></div>
    <button class="nav" id="pNext" title="下一序">›</button>
  </div>
  <div class="num" id="pNum"></div>
  <h2 id="pTitle"></h2>
  <div class="sub" id="pSub"></div>
  <div class="rule"></div>
  <div class="tabs"><i id="tabCraft" class="on">工 序</i><i id="tabChem">化学视角</i></div>
  <p id="pText"></p>
  <div id="pChem"></div>
</div>

<div id="chemLab">
  <div class="box">
    <button class="close" id="labClose">✕</button>
    <h3>窑烧实验台</h3>
    <div class="lsub">拖动空气阀门 · 观察燃烧产物如何决定松烟的生成</div>
    <canvas id="labCv"></canvas>
    <div class="air">
      <span>空气阀门</span>
      <input type="range" id="labAir" min="0" max="100" value="20">
      <span id="labAirTxt">氧气<b>不足</b> · 冒黑烟</span>
    </div>
    <div class="eqv" id="labEq"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= 基础 ================= */
const isMobile = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rand  = (a,b)=>a+Math.random()*(b-a);
const damp  = (cur,tgt,k,dt)=>cur+(tgt-cur)*(1-Math.exp(-k*dt));
const dampV3= (cur,tgt,k,dt)=>{cur.x=damp(cur.x,tgt.x,k,dt);cur.y=damp(cur.y,tgt.y,k,dt);cur.z=damp(cur.z,tgt.z,k,dt);};

const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.5:2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xeeeee6, 60, 520);

const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 1500);

/* 共享着色器 uniform */
const uni = {
  uTime : {value:0},
  uSun  : {value:new THREE.Vector3(-0.731,0.497,-0.468).normalize()},
  uMouse:{value:new THREE.Vector3(0,0,30)},
  uPulse:{value:0.2},
};

/* ================= 程序化贴图 ================= */
function makeTex(size, fn, opt={}){
  const c=document.createElement('canvas'); c.width=c.height=size;
  const g=c.getContext('2d'); fn(g,size);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  if(opt.repeat)t.repeat.set(opt.repeat[0],opt.repeat[1]);
  return t;
}
function mottle(g,s,n,cols,rmin,rmax,al){
  for(let i=0;i<n;i++){
    g.fillStyle=cols[(Math.random()*cols.length)|0];
    g.globalAlpha=rand(al*0.5,al);
    const r=rand(rmin,rmax);
    g.beginPath();g.arc(Math.random()*s,Math.random()*s,r,0,7);g.fill();
  }
  g.globalAlpha=1;
}
const texWood = makeTex(256,(g,s)=>{
  g.fillStyle='#6b4f38';g.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=42){
    g.fillStyle=`rgba(${60+Math.random()*30|0},${42+Math.random()*20|0},${28+Math.random()*14|0},.6)`;
    g.fillRect(0,y,s,42);
    for(let i=0;i<9;i++){ g.strokeStyle='rgba(40,26,16,.35)';g.lineWidth=1;
      g.beginPath();const yy=y+rand(4,38);g.moveTo(0,yy);
      g.bezierCurveTo(s*.3,yy+rand(-3,3),s*.7,yy+rand(-3,3),s,yy+rand(-2,2));g.stroke(); }
  }
});
const texPlank = makeTex(256,(g,s)=>{
  g.fillStyle='#7c5f42';g.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=36){
    g.fillStyle=`rgba(${100+Math.random()*26|0},${76+Math.random()*20|0},${50+Math.random()*14|0},.85)`;
    g.fillRect(0,y+1,s,34);
    g.fillStyle='rgba(40,26,16,.7)';g.fillRect(0,y,s,2);
    for(let i=0;i<6;i++){g.strokeStyle='rgba(70,48,30,.3)';g.beginPath();
      const yy=y+rand(6,30);g.moveTo(0,yy);g.lineTo(s,yy+rand(-4,4));g.stroke();}
  }
});
const texTile = makeTex(256,(g,s)=>{
  g.fillStyle='#39424c';g.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=26){
    g.fillStyle='rgba(18,24,30,.55)';g.fillRect(0,y,s,4);
    for(let x=8;x<s;x+=30){
      g.fillStyle='#4a5560';g.beginPath();g.arc(x,y+15,11,Math.PI,0);g.fill();
      g.fillStyle='rgba(210,225,235,.14)';g.beginPath();g.arc(x-3,y+12,4,Math.PI,0);g.fill();
    }
  }
  mottle(g,s,60,['rgba(255,255,255,.05)','rgba(0,0,0,.08)'],3,10,.5);
});
const texBrick = makeTex(256,(g,s)=>{
  g.fillStyle='#5e5951';g.fillRect(0,0,s,s);
  const bh=22,bw=52;
  for(let y=0,r=0;y<s;y+=bh,r++){
    for(let x=(r%2?-bw/2:0);x<s;x+=bw){
      g.fillStyle=`rgb(${112+Math.random()*22|0},${104+Math.random()*18|0},${92+Math.random()*16|0})`;
      g.fillRect(x+2,y+2,bw-4,bh-4);
    }
  }
  mottle(g,s,80,['rgba(0,0,0,.12)','rgba(255,255,255,.06)'],2,7,.5);

const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ uTime:uni.uTime, uSun:uni.uSun },
  vertexShader:`
    varying vec3 vDir;
    void main(){
      vDir = position;
      vec4 p = modelViewMatrix * vec4(position,1.0);
      gl_Position = projectionMatrix * p;
    }`,
  fragmentShader:`
    varying vec3 vDir;
    uniform vec3 uSun; uniform float uTime;
    float hash(vec2 p){ p=fract(p*vec2(233.34,851.73)); p+=dot(p,p+23.45); return fract(p.x*p.y); }
    float noise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
    float fbm(vec2 p){ float v=0.,a=.55; mat2 r=mat2(1.6,1.2,-1.2,1.6);
      for(int i=0;i<5;i++){ v+=a*noise(p); p=r*p; a*=.5; } return v; }
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y,0.0,1.0);
      vec3 col = mix(vec3(0.80,0.90,0.99), vec3(0.20,0.44,0.86), pow(h,0.52));
      float sd = max(dot(d,uSun),0.0);
      col += vec3(1.0,0.93,0.80)*pow(sd,1200.0)*6.0;
      col += vec3(1.0,0.86,0.62)*pow(sd,30.0)*0.45;
      col += vec3(1.0,0.95,0.86)*pow(sd,5.0)*0.14;
      if(d.y>0.015){
        vec2 uv = d.xz/(d.y+0.18);
        uv += uTime*0.006;
        float q = fbm(uv*0.55);
        float c = fbm(uv*1.35 + q*0.9 + vec2(uTime*0.01,0.0));
        float cov = smoothstep(0.46,0.74,c) * smoothstep(0.015,0.16,d.y);
        float shade = smoothstep(0.30,0.85, fbm(uv*1.35 + q*0.9 - uSun.xz*0.35));
        vec3 cc = mix(vec3(0.66,0.74,0.88), vec3(1.10,1.08,1.05), 1.0-shade*0.8);
        col = mix(col, cc, cov*0.92);
      }
      gl_FragColor = vec4(col,1.0);
    }`
});

const STREAM_PTS=[[-18,42],[-8,28],[2,18],[8,13],[13,10]];   // 山脚蜿蜒入湖（终点即湖岸）
function distStream(x,z){
  let m=1e9;
  for(let i=0;i<STREAM_PTS.length-1;i++){
    const ax=STREAM_PTS[i][0],az=STREAM_PTS[i][1],bx=STREAM_PTS[i+1][0],bz=STREAM_PTS[i+1][1];
    const vx=bx-ax,vz=bz-az,t=clamp(((x-ax)*vx+(z-az)*vz)/(vx*vx+vz*vz),0,1);
    m=Math.min(m,Math.hypot(x-(ax+vx*t),z-(az+vz*t)));
  }
  return m;
}
const DOOR_PTS=[[-16,8.2],[-7,7.5],[3,7.3],[12,6.0]];        // 门前横流（东端入湖）

    const vx=bx-ax,vz=bz-az,t=clamp(((x-ax)*vx+(z-az)*vz)/(vx*vx+vz*vz),0,1);

}
function ribbonGeo(pts,w0,w1,y){
  const pos=[],idx=[];
  for(let i=0;i<pts.length;i++){
    const q=pts[Math.min(i+1,pts.length-1)],r=pts[Math.max(i-1,0)];
    let dx=q[0]-r[0],dz=q[1]-r[1];const l=Math.hypot(dx,dz)||1;dx/=l;dz/=l;
    const w=(w0+(w1-w0)*i/(pts.length-1))*(1+0.14*Math.sin(i*2.3));
    pos.push(pts[i][0]-dz*w,y,pts[i][1]+dx*w, pts[i][0]+dz*w,y,pts[i][1]-dx*w);
    if(i<pts.length-1){const b=i*2;idx.push(b,b+1,b+2,b+1,b+3,b+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();return g;
}

// 远山（三重山脊）
function ridge(R,H,seed,cols){
  const seg=170, pos=[], col=[], idx=[];
  const cBase=new THREE.Color(cols[0]), cTop=new THREE.Color(cols[1]);
  for(let i=0;i<=seg;i++){
    const a=i/seg*Math.PI*2;
    const h=H*(0.5+0.28*Math.sin(a*3+seed)+0.16*Math.sin(a*7.3+seed*2)+0.09*Math.sin(a*13.7+seed*3));
    const r=R*(1+0.05*Math.sin(a*5+seed));
    const x=Math.cos(a)*r, z=Math.sin(a)*r;
    pos.push(x,-2,z, x,Math.max(h,H*0.15),z);
    col.push(cBase.r,cBase.g,cBase.b, cTop.r,cTop.g,cTop.b);
    if(i<seg){const b=i*2; idx.push(b,b+1,b+2, b+1,b+3,b+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g,stdMat({vertexColors:true,roughness:1},.2));
  m.position.y=-0.1; scene.add(m);
}

/* ================= 松林（实例化 + 流体扭曲） ================= */
function makeTreeGeo(){
  const parts=[];
  function part(geo, fn){                  // fn(局部坐标)->该顶点颜色
    const p=geo.attributes.position, n=p.count, c=new Float32Array(n*3);
    for(let i=0;i<n;i++){
      const col=fn(p.getX(i),p.getY(i),p.getZ(i));
      c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b;
    }
    geo.setAttribute('color',new THREE.BufferAttribute(c,3));
    parts.push(geo);
  }
  // 树干：根部外张 + 微弯 + 纵向明暗
  {
    const g=new THREE.CylinderGeometry(0.07,0.19,2.9,7,4,true);
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++){
      const t=clamp((p.getY(i)+1.45)/2.9,0,1);
      const flare=1+Math.max(0,1-t*4)*0.9;                    // 根部张开
      p.setX(i,p.getX(i)*flare+Math.sin(t*2.2)*0.10*t);       // 微弯
      p.setZ(i,p.getZ(i)*flare);
    }
    g.computeVertexNormals();
    part(g,(x,y)=>new THREE.Color(0x453527).lerp(new THREE.Color(0x6f5940),clamp((y+1.45)/2.9,0,1)));
  }
  // 冠层：六层不规则裙状枝盘（下深上亮、盘缘下垂）
  const cDark=new THREE.Color(0x123023), cMid=new THREE.Color(0x245235),
        cLite=new THREE.Color(0x457a45), cSun =new THREE.Color(0x5f8f52);
  for(let i=0;i<6;i++){
    const t=i/5, R=1.66-t*1.06, h=1.10-t*0.30, yB=1.55+i*0.76, ph=rand(0,7);
    const g=new THREE.CylinderGeometry(R*0.40,R,h,11,1,true);
    const p=g.attributes.position;
    for(let v=0;v<p.count;v++){
      const y=p.getY(v), a=Math.atan2(p.getZ(v),p.getX(v));
      const noise=1+0.16*Math.sin(a*3+ph)+0.09*Math.sin(a*7+ph*1.7)+rand(-0.05,0.05);
      if(y<0){                                                 // 盘缘：外扩噪声 + 下垂
        p.setX(v,p.getX(v)*noise); p.setZ(v,p.getZ(v)*noise);
        p.setY(v,y-(0.10+0.10*Math.abs(Math.sin(a*2.5+ph))));
      }else{ p.setX(v,p.getX(v)*noise*0.6); p.setZ(v,p.getZ(v)*noise*0.6); }
    }
    g.translate(0,yB+h/2,0); g.computeVertexNormals();
    const lo=cDark.clone().lerp(cMid,t*0.7), hi=cMid.clone().lerp(cSun,t);
    part(g,(x,y)=>lo.clone().lerp(hi,clamp((y-yB)/h,0,1)));
  }
  // 顶梢
  {
    const g=new THREE.ConeGeometry(0.30,1.15,9);
    g.rotateZ(rand(-0.08,0.08)); g.translate(0,6.15+0.32,0);
    part(g,()=>cSun.clone().lerp(cLite,rand(0.3,0.7)));
  }
  return mergeGeometries(parts);
}

foliageMat.onBeforeCompile = (sh)=>{
  sh.uniforms.uTime=uni.uTime; sh.uniforms.uMouse=uni.uMouse; sh.uniforms.uPulse=uni.uPulse;
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', `#include <common>
      uniform float uTime; uniform vec3 uMouse; uniform float uPulse;
      /* 笔触带：方向缓转、墨带周期横扫林海，枯润因树而异 */
      vec3 inkBrush(out float hsh){
        #ifdef USE_INSTANCING
          vec2 it=vec2(instanceMatrix[3].x,instanceMatrix[3].z);
        #else
          vec2 it=vec2(0.0);
        #endif
        hsh=fract(sin(dot(floor(it*0.37),vec2(127.1,311.7)))*43758.5453);
        float ang=uTime*0.04;
        vec2 bdir=vec2(cos(ang),sin(ang));
        float d=dot(it,bdir);
        float c=mod(uTime*10.5,230.0)-40.0;             // 笔锋位置（提速）
        float band=exp(-pow((d-c)/15.0,2.0));           // 笔腹宽度
        return vec3(bdir*band*(0.45+0.65*hsh),band);
      }`)
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      #ifdef USE_INSTANCING
        vec4 fw = modelMatrix * instanceMatrix * vec4(transformed,1.0);
      #else
        vec4 fw = modelMatrix * vec4(transformed,1.0);
      #endif
      float hFac = smoothstep(0.8, 5.5, fw.y);
      float sway = sin(uTime*1.2+fw.x*0.13+fw.z*0.11)*0.5 + sin(uTime*2.3+fw.z*0.31+fw.x*0.07)*0.5;
      vec2 md = fw.xz - uMouse.xz;
      float mdist = length(md);
      float rip = sin(mdist*1.35 - uTime*3.2) * exp(-mdist*0.30) * uPulse;
      /* 水墨笔触：顺笔势拖摆 + 散毫细颤 */
      float hsh; vec3 br=inkBrush(hsh);
      float bmag=length(br);
      float dry=0.75+0.5*sin(uTime*2.2+hsh*40.0);       // 运笔颤动
      transformed.x += (sway*0.15 + rip*0.55 + br.x*1.7*dry + sin(fw.x*1.9+uTime*3.3)*0.30*bmag) * hFac;
      transformed.z += (sway*0.11 + rip*0.40 + br.y*1.3*dry + sin(fw.z*1.7-uTime*2.9)*0.30*bmag) * hFac;
      transformed.y += (-abs(rip)*0.35 - bmag*abs(sin(fw.x*1.3+fw.z*1.1+uTime*3.1))*0.22) * hFac;
      /* 湿墨：笔扫过处瞬时加深；鼠标涟漪如墨点晕开 */
      #if defined(USE_COLOR)
        vColor.rgb *= 1.0 - (bmag*0.20*(0.6+0.4*hsh) + abs(rip)*0.22);
      #endif`);
};

      for(let j=0;j<=seg;j++){
        const t=j/seg*2-1;
        const [x,y,z,u,v]=fn(s,t);
        pos.push(x,y,z); uv.push(u,v);
      }
    }
    for(let i=0;i<seg;i++)for(let j=0;j<seg;j++){
      const a=start+i*(seg+1)+j,b=a+1,c=a+seg+1,d2=c+1;
      idx.push(a,b,c, b,d2,c);
    }
  }
  const X=(s)=>ridgeHalf+(W/2-ridgeHalf)*Math.pow(s,0.72);
  const Z=(s)=>D/2*Math.pow(s,0.8);
  const Y=(s,tu)=>h*(1-Math.pow(s,0.58)) + eaveUp*Math.pow(s,3)*tu*tu;
  face((s,t)=>{const x=t*X(s),z=Z(s),y=Y(s,Math.abs(t));return [x,y,z, t*0.5+0.5, s*1.1];});
  face((s,t)=>{const x=t*X(s),z=-Z(s),y=Y(s,Math.abs(t));return [x,y,z, t*0.5+0.5, s*1.1];});
  face((s,t)=>{const z=t*Z(s),x=X(s),y=Y(s,Math.abs(t));return [x,y,z, t*0.5+0.5, s*1.1];});
  face((s,t)=>{const z=t*Z(s),x=-X(s),y=Y(s,Math.abs(t));return [x,y,z, t*0.5+0.5, s*1.1];});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* 工笔画后期：暖赭勾线 · 分染层次 · 淡雅温润 · 绢纹肌理（作用于色调映射后的 sRGB 画面） */
const gongbiPass=new ShaderPass({
  uniforms:{ tDiffuse:{value:null}, uInk:{value:1}, uTime:{value:0}, uRes:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv;
    void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    uniform sampler2D tDiffuse; uniform float uInk; uniform float uTime; uniform vec2 uRes;
    varying vec2 vUv;
    float lum(vec3 c){ return dot(c,vec3(0.299,0.587,0.114)); }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){
      vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),f.x),
                 mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),f.x),f.y);
    }
    float fbm(vec2 p){ return vnoise(p)*0.62 + vnoise(p*2.17+13.7)*0.38; }
    void main(){
      vec2 px=1.0/uRes;
      vec3 c0=texture2D(tDiffuse,vUv).rgb;
      /* 柔化：对角微模糊，先化开数字锐边 */
      vec3 cb=( texture2D(tDiffuse,vUv+px*vec2( 1.6, 1.6)).rgb
              + texture2D(tDiffuse,vUv+px*vec2(-1.6, 1.6)).rgb
              + texture2D(tDiffuse,vUv+px*vec2( 1.6,-1.6)).rgb
              + texture2D(tDiffuse,vUv+px*vec2(-1.6,-1.6)).rgb )*0.25;
      vec3 col=mix(c0,cb,0.55);
      /* 细节回填：轻高通，远细近精，保住工笔的精致刻画 */
      col+=(c0-cb)*0.30;
      /* 八向亮度梯度勾线：线条随形走，软进软出无生硬数字边 */
      float gx= lum(texture2D(tDiffuse,vUv+px*vec2( 2.4,0.)).rgb)
               -lum(texture2D(tDiffuse,vUv+px*vec2(-2.4,0.)).rgb);
      float gy= lum(texture2D(tDiffuse,vUv+px*vec2(0., 2.4)).rgb)
               -lum(texture2D(tDiffuse,vUv+px*vec2(0.,-2.4)).rgb);
      float gx2=(lum(texture2D(tDiffuse,vUv+px*vec2( 1.7, 1.7)).rgb)
                +lum(texture2D(tDiffuse,vUv+px*vec2( 1.7,-1.7)).rgb)
                -lum(texture2D(tDiffuse,vUv+px*vec2(-1.7, 1.7)).rgb)
                -lum(texture2D(tDiffuse,vUv+px*vec2(-1.7,-1.7)).rgb))*0.5;
      float gy2=(lum(texture2D(tDiffuse,vUv+px*vec2( 1.7, 1.7)).rgb)
                +lum(texture2D(tDiffuse,vUv+px*vec2(-1.7, 1.7)).rgb)
                -lum(texture2D(tDiffuse,vUv+px*vec2( 1.7,-1.7)).rgb)
                -lum(texture2D(tDiffuse,vUv+px*vec2(-1.7,-1.7)).rgb))*0.5;
      float grad=length(vec2(gx+gx2,gy+gy2));
      float line=smoothstep(0.03,0.11,grad);
      line*=0.6+0.4*fbm(vUv*vec2(80.0,60.0)+uTime*0.012);     // 枯润相间，笔断意连
      col=mix(col, vec3(0.205,0.180,0.160), line*uInk*0.78);  // 深赭墨线，非死黑
      /* 分染：亮度软六阶，色相不变而层次分明（如绢上层层罩染） */
      float L=clamp(lum(col),0.001,0.999);
      float q=floor(L*6.0)/6.0+1.0/12.0;
      col*= mix(L,q,0.30)/L;
      /* 淡雅温润：轻降饱和 · 暗部染暖赭 · 亮部偏暖绢（保主色） */
      col=mix(vec3(lum(col)),col,0.85);
      col=mix(vec3(0.52),col,0.86);
      col=mix(col,col*vec3(1.045,0.99,0.925),1.0-smoothstep(0.18,0.75,L));
      col=mix(col,col*vec3(1.0,0.99,0.955)+vec3(0.028,0.025,0.018),smoothstep(0.52,1.0,L));
      /* 压 CG 高光：最亮处褪成绢白，抹去渲染反光的数字感 */
      col=mix(col,vec3(lum(col)),smoothstep(0.82,1.0,lum(col))*0.55);
      /* 雾霭流披：只罩亮部与远景天光，主色不被雾吃；随时间流动 */
      float veil=fbm(vec2(vUv.x*3.2+uTime*0.045, vUv.y*2.2-uTime*0.028))*0.7
                +fbm(vec2(vUv.x*5.7-uTime*0.036, vUv.y*4.1+uTime*0.022))*0.3;
      float m2=smoothstep(0.50,1.0,lum(col))*uInk;
      col=mix(col, vec3(0.91,0.925,0.905), veil*m2*0.10);
      /* 绢纹：细织纹+微颗粒，破数字平滑 */
      float weave=sin(vUv.y*uRes.y*1.65)*0.5+0.5;
      col+=((hash(vUv*uRes.xy*0.7)-0.5)*0.6+(weave-0.5)*0.5)*0.045*uInk;
      /* 黑位抬入暖纸（工笔无死黑） */
      col=col*0.94+vec3(0.048,0.042,0.034);
      gl_FragColor=vec4(col,1.0);
    }`
});
composer.addPass(gongbiPass);
const updGB=()=>gongbiPass.uniforms.uRes.value.set(

/* —— 窑烧实验台（内嵌覆盖层） —— */
{
  const cv=document.getElementById('labCv'),ctx=cv.getContext('2d');
  const slider=document.getElementById('labAir'),txt=document.getElementById('labAirTxt'),eqv=document.getElementById('labEq');
  let W=0,H=0,raf=0;
  let flames=[],soots=[],co2s=[];
  const fit=()=>{W=cv.width=cv.clientWidth||600;H=cv.height=Math.max(240,Math.round(W*0.6));};
  function eqHtml(rich){
    return rich
      ?`C + O₂ <span class="cond">点燃</span> CO₂<small>碳充分燃烧，生成二氧化碳——木炭烧得干干净净，得不到碳黑</small>`
      :`2C + O₂ <span class="cond">点燃</span> 2CO<small>氧气不足，部分碳变一氧化碳；更多碳来不及燃烧，化作碳黑（松烟）析出</small>`;
  }
  function airTxt(rich){return rich?'氧气<b>充足</b> · 充分燃烧':'氧气<b>不足</b> · 冒黑烟';}
  function step(){
    if(!UI.chemLab.classList.contains('open')){raf=0;return;}
    const air=+slider.value,rich=air>=55;
    if(flames.length<(rich?40:28)&&Math.random()<.6)
      flames.push({x:W*0.5+(Math.random()-.5)*W*0.3,y:H*0.72,vx:(Math.random()-.5)*.7,vy:-(1.2+Math.random()*1.6),life:1,r:3+Math.random()*6});
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,rich?'#141a1c':'#171310');bg.addColorStop(1,'#0c0a08');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#4d4436';ctx.lineWidth=10;
    ctx.beginPath();ctx.arc(W*0.5,H*1.15,W*0.46,Math.PI*1.06,Math.PI*1.94);ctx.stroke();
    ctx.strokeStyle='#2e2921';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(W*0.5,H*1.15,W*0.42,Math.PI*1.08,Math.PI*1.92);ctx.stroke();
    ctx.fillStyle='#060504';
    ctx.beginPath();ctx.ellipse(W*0.5,H*0.9,W*0.09,H*0.075,0,0,7);ctx.fill();
    ctx.strokeStyle='#5d4a33';ctx.lineWidth=7;ctx.lineCap='round';
    for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(W*0.38+i*W*0.05,H*0.8);ctx.lineTo(W*0.44+i*W*0.05,H*0.74);ctx.stroke();}
    ctx.lineCap='butt';
    for(const f of flames){
      f.x+=f.vx;f.y+=f.vy;f.life-=.022;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(0.5+f.life),0,7);
      ctx.fillStyle=rich?`rgba(120,190,255,${f.life*.9})`:`rgba(230,128,38,${f.life*.9})`;
      ctx.fill();
    }
    flames=flames.filter(f=>f.life>0);
    if(Math.random()<(rich?.2:.75))
      soots.push({x:W*0.5+(Math.random()-.5)*W*0.2,y:H*0.66,vy:-(.5+Math.random()*.7),vx:(Math.random()-.5)*.9,r:1.5+Math.random()*3,stuck:0,wx:0,wy:0});
    for(const s of soots){
      if(!s.stuck){
        s.x+=s.vx;s.y+=s.vy;
        const d=Math.hypot((s.x-W*0.5)/W*2,(s.y-H*0.86)/H);
        if(d>0.62&&d<0.95&&Math.random()<.3){s.stuck=1;s.wx=s.x;s.wy=s.y;}
      }
      ctx.beginPath();ctx.arc(s.stuck?s.wx:s.x,s.stuck?s.wy:s.y,s.r*(s.stuck?.9:1),0,7);
      ctx.fillStyle=s.stuck?'rgba(15,13,10,.9)':'rgba(30,26,22,.55)';ctx.fill();
    }
    if(soots.length>220)soots.splice(0,soots.length-220);
    if(rich&&Math.random()<.4)
      co2s.push({x:W*0.5+(Math.random()-.5)*W*.24,y:H*.6,vy:-(.8+Math.random()),vx:(Math.random()-.5)*1.1,life:1});
    for(const c of co2s){
      c.x+=c.vx;c.y+=c.vy;c.life-=.012;
      ctx.beginPath();ctx.arc(c.x,c.y,4,0,7);
      ctx.strokeStyle=`rgba(150,210,220,${c.life*.5})`;ctx.lineWidth=1.4;ctx.stroke();
      ctx.font='11px sans-serif';ctx.fillStyle=`rgba(150,210,220,${c.life*.8})`;ctx.fillText('CO₂',c.x+6,c.y);
    }
    co2s=co2s.filter(c=>c.life>0);
    raf=requestAnimationFrame(step);
  }
  function syncEq(){
    const rich=(+slider.value)>=55;
    eqv.innerHTML=eqHtml(rich);txt.innerHTML=airTxt(rich);
  }
  slider.addEventListener('input',syncEq);
  // openLab 按钮由 renderChem 动态生成，用事件委托绑定
  UI.pChem.addEventListener('click',e=>{
    const b=e.target.closest('#openLab');
    if(!b)return;
    e.stopPropagation();
    fit();syncEq();
    UI.chemLab.classList.add('open');
    if(!raf)raf=requestAnimationFrame(step);
  });
  document.getElementById('labClose').addEventListener('click',e=>{
    e.stopPropagation();
    UI.chemLab.classList.remove('open');
    if(raf){cancelAnimationFrame(raf);raf=0;}
  });
  addEventListener('resize',()=>{if(UI.chemLab.classList.contains('open'))fit();});
}

  if(state!=='inside'&&state!=='focus')return;
  closePanel();
  state='toOutside'; arriveState='outside';
  queue=[DOOR_PASS.clone(),OUTSIDE_POS.clone()];
  lookTgt=OUTSIDE_LOOK.clone();
  camK=1.05;
  UI.exit.classList.remove('show');
}
function focusStation(i,fromDot=false){
  if(state!=='inside'&&state!=='focus'&&!fromDot)return;
  const st=STATIONS[i];
  focusIdx=i; state='focus';
  const p=new THREE.Vector3(st.pos[0],0.81,st.pos[1]);
  const heart=new THREE.Vector3(0,1.5,0.5);
  const dir=heart.sub(p).setY(0).normalize()
    .applyAxisAngle(new THREE.Vector3(0,1,0),st.ang);
  posTgt=p.clone().add(dir.multiplyScalar(st.dist)); posTgt.y=0.81+st.h;
  lookTgt=p.clone().add(new THREE.Vector3(0,st.ly,0));
  camK=1.25;
  UI.pNum.textContent='第'+st.num+'序 · '+st.name;
  UI.pTitle.textContent=st.title;
  UI.pSub.textContent=st.sub;
  UI.pText.textContent=st.text;
  renderChem(i);
  UI.panel.classList.add('show');
  STATIONS.forEach((s,j)=>{
    s.dot.className = j<i?'done':(j===i?'act':'');
  });
  UI.label.classList.remove('on');
  setHint('‹ › 换序观演 · 点击空白处退回');
}
function closePanel(){
  if(focusIdx>=0){ STATIONS[focusIdx].dot.classList.remove('act'); }
  UI.panel.classList.remove('show');
  if(state==='inside'||state==='focus') setHint('点击器具 · 观制墨六序');
  if(state==='focus'){
    state='inside';
    posTgt=INSIDE_POS.clone(); lookTgt=INSIDE_LOOK.clone(); camK=1.3;
  }
  focusIdx=-1;
}
UI.close.addEventListener('click',e=>{e.stopPropagation();closePanel();});
UI.exit.addEventListener('click',e=>{e.stopPropagation();exitWorkshop();});

/* 指针 */
const pointer=new THREE.Vector2(); let pointerMoved=false, downXY=null;
addEventListener('pointermove',e=>{
  pointer.set(e.clientX,e.clientY); pointerMoved=true;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight*2-1));
  uni.uPulse.value=Math.min(1.6,uni.uPulse.value+0.3);
},{passive:true});
addEventListener('pointerdown',e=>{ downXY=[e.clientX,e.clientY]; },{passive:true});
addEventListener('pointerup',e=>{
  if(!downXY)return;
  const dx=e.clientX-downXY[0],dy=e.clientY-downXY[1];
  downXY=null;
  // UI 控件（面板/按钮/实验台）上的点击不进入画布逻辑
  if(e.target && e.target.closest && e.target.closest('#panel,#exitBtn,#chemLab'))return;
  if(dx*dx+dy*dy>64)return;
  // 墨晕反馈
  const r=document.createElement('div'); r.className='ripple';
  r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
  document.body.appendChild(r); setTimeout(()=>r.remove(),750);
  pointer.set(e.clientX,e.clientY);   // 以抬起点为准
  handleClick();
});
function handleClick(){
  if(state==='toInside'||state==='toOutside')return;
  raycaster.setFromCamera(new THREE.Vector2(
    pointer.x/innerWidth*2-1, -(pointer.y/innerHeight*2-1)),camera);
  let list=hitTargets;
  if(state==='outside') list=hitTargets.filter(h=>h.userData.type==='door');
  else if(state==='inside') list=hitTargets.filter(h=>h.userData.type==='station'||h.userData.type==='door');
  else if(state==='focus') list=hitTargets.filter(h=>h.userData.type==='station');
  const hit=raycaster.intersectObjects(list,false)[0];
  if(!hit){ if(state==='focus')closePanel(); return; }
  const ud=hit.object.userData;
  if(ud.type==='door'){ state==='outside'?enterWorkshop():exitWorkshop(); }
  else focusStation(ud.idx);
}
function hoverCheck(){
  if(isMobile||state==='toInside'||state==='toOutside'){UI.label.classList.remove('on');return;}
  raycaster.setFromCamera(new THREE.Vector2(
    pointer.x/innerWidth*2-1, -(pointer.y/innerHeight*2-1)),camera);
  let list=[];
  if(state==='outside') list=hitTargets.filter(h=>h.userData.type==='door');
  else if(state==='inside') list=hitTargets.filter(h=>h.userData.type==='station');
  const hit=raycaster.intersectObjects(list,false)[0];
  if(hit){
    const ud=hit.object.userData;
    UI.label.textContent = ud.type==='door'
      ? (state==='outside'?'门 扉 · 入内':'')
      : '第'+STATIONS[ud.idx].num+'序 · '+STATIONS[ud.idx].name+'　点击细观';
    UI.label.style.left=pointer.x+'px'; UI.label.style.top=pointer.y+'px';
    if(UI.label.textContent){UI.label.classList.add('on');document.body.classList.add('grab');}
    else{UI.label.classList.remove('on');document.body.classList.remove('grab');}
  }else{
    UI.label.classList.remove('on'); document.body.classList.remove('grab');
  }
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let T=0, fpsAcc=0, fpsCnt=0, quality=2;
let kilnFireOn=0, steamOn=0, goldBrushOn=0;          // 演示强度（阻尼）
let moldClock=0, moldPressS=0, moldLiftS=0;          // 墨模压脱相位
let chopClock=0, chopSplitS=0;                       // 斧劈相位

function updateCamera(dt){
  // 航点过渡
  if(state==='toInside'||state==='toOutside'){
    if(queue.length){
      posTgt.copy(queue[0]);
      if(state==='toInside'){
        const nxt=queue[1]||INSIDE_POS;
        lookTgt.lerpVectors(queue[0],nxt,0.5).setY(1.8);
        if(queue.length===1)lookTgt.copy(INSIDE_LOOK);
      }else{
        lookTgt.lerp(queue[0].z>5?OUTSIDE_LOOK:DOOR_PASS.clone().setY(2.2),0.3);
      }
      if(camPos.distanceTo(queue[0])<0.55){
        queue.shift();
        if(!queue.length){
          state=arriveState; camK=1.9;
          if(state==='inside'){ posTgt=INSIDE_POS.clone(); lookTgt=INSIDE_LOOK.clone();
            setHint('点击器具 · 观制墨六序'); UI.exit.classList.add('show'); }
          else{ posTgt=OUTSIDE_POS.clone(); lookTgt=OUTSIDE_LOOK.clone();
            setHint('移动光标 · 环视松谷　　点击门扉 · 入内观墨'); }
        }
      }
    }
  }
  // 阻尼视差
  mouseS.x=damp(mouseS.x,mouse.x,3.2,dt);
  mouseS.y=damp(mouseS.y,mouse.y,3.2,dt);
  let ampP=2.4, ampL=1.3;
  if(state==='inside'){ ampP=0.45; ampL=2.4; }   // 室内：视差改为视线主导，环视两侧器具
  else if(state==='toInside'||state==='toOutside'){ ampP=0.9; ampL=0.85; }
  if(state==='focus'){ ampP=0.28; ampL=0.4; }
  const fwd=new THREE.Vector3().subVectors(lookTgt,posTgt).normalize();
  const right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
  const up=new THREE.Vector3().crossVectors(right,fwd).normalize();
  const p=posTgt.clone().addScaledVector(right,mouseS.x*ampP).addScaledVector(up,mouseS.y*ampP*0.45);
  const l=lookTgt.clone().addScaledVector(right,mouseS.x*ampL).addScaledVector(up,mouseS.y*ampL*0.5);
  if(state==='focus'){ l.y+=Math.sin(T*0.25)*0.05; l.x+=Math.sin(T*0.18)*0.04; }
  dampV3(camPos,p,camK,dt);
  dampV3(camLook,l,camK,dt);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  const rollTgt=state==='outside'?mouseS.x*0.012:mouseS.x*0.004;
  rollS=damp(rollS,rollTgt,2.5,dt);
  camera.rotateZ(rollS);
}
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),0.05); T+=dt;
  uni.uTime.value=T;
  // 光标流体脉冲
  raycaster.setFromCamera(new THREE.Vector2(mouse.x,mouse.y),camera);
  const rd=raycaster.ray.direction;
  if(rd.y<-0.02){
    const t=-raycaster.ray.origin.y/rd.y;
    if(t>0&&t<220) uni.uMouse.value.copy(raycaster.ray.origin).addScaledVector(rd,t);
  }
  uni.uPulse.value=Math.max(0.18, uni.uPulse.value*Math.exp(-dt*1.6));
  // 光标辉光流转：外景随光标漂移，入坊淡出
  {
    const outK=(state==='inside'||state==='focus')?0:1;
    glowK=damp(glowK,outK,3,dt);
    // 锚点：沿视线取地面点，距离钳制在近景（6~34），保证辉光始终可读
    raycaster.setFromCamera(new THREE.Vector2(mouse.x,mouse.y),camera);
    const grd=raycaster.ray.direction;
    let gt=grd.y<-0.02 ? -raycaster.ray.origin.y/grd.y : 30;
    gt=clamp(gt,6,34);
    raycaster.ray.at(gt,_gpt);
    glowPos.x=damp(glowPos.x,_gpt.x,4.5,dt);
    glowPos.z=damp(glowPos.z,_gpt.z,4.5,dt);
    const gp2=glowPos.x, gz2=glowPos.z;
    glowHalo.position.set(gp2,1.15,gz2);
    inkHaloMat.opacity=glowK*0.30*(0.9+0.1*Math.sin(T*1.3));   // 墨晕呼吸
    for(const rg of inkRings){                                 // 墨圈周期外扩晕开
      const rt=((T+rg.userData.off)%2.8)/2.8;
      rg.position.set(gp2,1.25,gz2);
      rg.scale.setScalar(0.6+rt*7.2);
      rg.material.opacity=glowK*0.30*(1-rt)*Math.smoothstep(rt,0,0.12);
    }
  }
  // 幡
  banner.rotation.z=Math.sin(T*1.25)*0.045; banner.rotation.x=Math.sin(T*0.85+1)*0.03;
  // 窑烟
  smokeBoost=damp(smokeBoost, focusIdx===1?1.8:1, 1.5, dt);
  smokes.forEach(s=>{
    const u=s.userData; u.age+=dt*u.speed;
    if(u.age>u.dur){u.age=0;u.seed=rand(0,7);}
    const a=u.age;
    s.position.set(
      kilnSmokeAnchor.x+Math.sin(a*2+u.seed)*0.16*a,
      kilnSmokeAnchor.y+a*1.05,
      kilnSmokeAnchor.z+Math.cos(a*1.6+u.seed)*0.13*a - a*0.12);
    s.scale.setScalar(0.4+a*1.15);
    s.material.opacity=0.42*Math.smoothstep(a,0,0.35)*(1-Math.smoothstep(a,u.dur*0.65,u.dur))*smokeBoost;
  });
  // 谷间流雾
  mists.forEach(m=>{ const u=m.userData; u.a+=u.v*dt/Math.max(u.r*0.01,1);
    m.position.set(Math.cos(u.a)*u.r, u.y+Math.sin(T*0.11+u.r)*0.5, Math.sin(u.a)*u.r);
    m.material.opacity=u.o*(0.85+0.15*Math.sin(T*0.23+u.r)); });
  // 尘埃
  {
    const {base,phase}=motes.userData;
    const p=motes.geometry.attributes.position;
    for(let i=0;i<p.count;i++){
      const ph=phase[i];
      p.setX(i,base[i*3]+Math.sin(T*0.3+ph)*0.35);
      p.setY(i,base[i*3+1]+Math.sin(T*0.5+ph*1.7)*0.3);
      p.setZ(i,base[i*3+2]+Math.cos(T*0.25+ph)*0.35);
    }
    p.needsUpdate=true;
  }
  // 光束呼吸
  shafts.forEach((sh,i)=>{ sh.m.material.opacity=sh.base*(0.7+0.3*Math.sin(T*0.4+sh.ph)); });
  // 湖雾漂移
  lakeMists.forEach((s,i)=>{ s.position.x+=Math.sin(T*0.05+i*2)*0.004; });
  // 灯焰
  lanternFlames.forEach((m,i)=>{ m.emissiveIntensity=1.5+Math.sin(T*7+i*3)*0.25; });
  // 描金微光
  goldMat.emissiveIntensity=focusIdx===5?0.55+Math.sin(T*2.6)*0.3:0.2;
  // 方锤
  {
    const t=focusIdx===3?Math.sin(T*3.1)*0.5-0.3:-0.35;
    hammerPivot.rotation.z=damp(hammerPivot.rotation.z,t,focusIdx===3?10:3,dt);
  }
  /* —— 工序演示动画（仅对应站点聚焦时展开，阻尼进出）—— */
  // 壹 · 斧劈松木（举斧—劈落—分裂—复位）
  chopClock+=dt;
  {
    const cyc=2.3, ct=(chopClock%cyc)/cyc;
    let sTgt=AXE_REST, splitT=0;
    if(focusIdx===0){
      const raise=Math.smoothstep(ct,0,0.30)*(1-Math.smoothstep(ct,0.42,0.52));
      sTgt=0.06+raise*1.0;
      splitT=Math.smoothstep(ct,0.53,0.56)*(1-Math.smoothstep(ct,0.86,0.96));
    }
    chopSwingS=chopSwingS===null?sTgt:damp(chopSwingS,sTgt,focusIdx===0?18:4,dt);
    chopSplitS=damp(chopSplitS,splitT,16,dt);
    axeG.rotation.x=chopSwingS;
    logHalves.forEach((h,i)=>{
      const sgn=i?-1:1;
      h.position.x=h.userData.bx+sgn*chopSplitS*0.16;
      h.rotation.z=sgn*chopSplitS*0.08;
    });
  }
  // 贰 · 窑火明灭
  kilnFireOn=damp(kilnFireOn,focusIdx===1?1:0,2.5,dt);
  if(kilnFireOn>0.005){
    kilnFireMat.opacity=kilnFireOn*(0.55+Math.sin(T*9.2)*0.18+Math.sin(T*23.7)*0.12);
    kilnLight.intensity=kilnFireOn*(2.2+Math.sin(T*11.3)*0.7);
  }else{kilnFireMat.opacity=0;kilnLight.intensity=0;}
  // 叁 · 熬胶热气
  steamOn=damp(steamOn,focusIdx===2?1:0,2.5,dt);
  steams.forEach(sp=>{
    const u=sp.userData, a=(T*0.35+u.ph)%1;
    sp.position.set(u.bx+Math.sin(a*6+u.ph)*0.04, u.by+a*0.5, u.bz);
    sp.scale.setScalar(0.1+a*0.24);
    sp.material.opacity=steamOn*0.3*Math.sin(Math.PI*a);
  });
  // 肆 · 捶打回弹（与锤头落点同步）
  {
    const p=Math.pow(Math.max(0,Math.sin(T*3.1)),10)*(focusIdx===3?1:0);
    inkMass.scale.set(1.3*(1+0.09*p), 0.55*(1-0.3*p), 1.0*(1+0.09*p));
  }
  // 伍 · 压模脱锭
  moldClock+=dt;
  {
    const cyc=2.6, mt=(moldClock%cyc)/cyc;
    let press=0, lift=0;
    if(focusIdx===4){
      press=Math.smoothstep(mt,0,0.12)*(1-Math.smoothstep(mt,0.45,0.62));
      lift =Math.smoothstep(mt,0.62,0.75)*(1-Math.smoothstep(mt,0.88,1));
    }
    moldPressS=damp(moldPressS,press,9,dt);
    moldLiftS =damp(moldLiftS,lift,9,dt);
    moldTop.position.y=moldTopBaseY-moldPressS*0.07;
    moldSticks.forEach((s,i)=>{ s.position.y=s.userData.baseY+moldLiftS*(0.15-i*0.045); });
  }
  // 陆 · 运笔描金
  goldBrushOn=damp(goldBrushOn,focusIdx===5?1:0,2.5,dt);
  goldBrush.position.x=goldBrushBase.x+goldBrushOn*Math.sin(T*2.0)*0.1;
  goldBrush.position.z=goldBrushBase.z+goldBrushOn*Math.sin(T*1.0)*0.07;
  goldBrush.rotation.z=0.06+goldBrushOn*Math.sin(T*2.0)*0.12;
  updateCamera(dt);
  if(pointerMoved){ hoverCheck(); pointerMoved=false; }
  // 帧率守护
  fpsAcc+=dt; fpsCnt++;
  if(fpsAcc>2.5){
    const fps=fpsCnt/fpsAcc;
    if(fps<44&&quality>0){
      quality--;
      if(quality===1){ renderer.setPixelRatio(Math.min(devicePixelRatio,1.25)); bloom.strength=0.24; }
      else{ bloom.enabled=false; sun.shadow.mapSize.set(1024,1024);
        if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;} }
      composer.setSize(innerWidth,innerHeight); updGB();
    }
    fpsAcc=0; fpsCnt=0;
  }
  // 工笔后期强度随镜头状态阻尼过渡：外景全幅，特写稍收以保细节
  const paintTgt=(state==='focus')?0.45:(state==='inside'?0.62:1.0);
  gongbiPass.uniforms.uInk.value=damp(gongbiPass.uniforms.uInk.value,paintTgt,1.6,dt);
  gongbiPass.uniforms.uTime.value=T;
  composer.render();
}
Math.smoothstep=(x,a,b)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

function applyFov(){
  camera.aspect=innerWidth/innerHeight;
  // 水平视野自适应：窄窗口自动放宽竖直FOV，保证"作坊偏左、湖在右、远山在后"构图不塌
  const targetH=46;   // 目标水平视野约46°
  const v=THREE.MathUtils.radToDeg(2*Math.atan(Math.tan(THREE.MathUtils.degToRad(targetH/2))/camera.aspect));
  camera.fov=THREE.MathUtils.clamp(v,27,46);
  camera.updateProjectionMatrix();
}
addEventListener('resize',()=>{
  applyFov();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight); updGB();
});
applyFov();

/* 启动 */
renderer.compile(scene,camera);
tick();
setTimeout(()=>{
  UI.loader.classList.add('hide');
  UI.title.classList.remove('off');
  UI.intro.classList.add('show');            // 开卷：古籍引入渐显
},1400);

/* 启卷：落墨开卷，进入作坊 */
const introEl=document.getElementById('intro');
document.getElementById('openBtn').addEventListener('click',()=>{
  if(introEl.classList.contains('bye'))return;
  introEl.classList.add('bye');
  uni.uPulse.value=1;                        // 一记墨点：松林晕开涟漪
  setTimeout(()=>UI.hint.classList.remove('off'),900);
  setTimeout(()=>introEl.classList.add('gone'),1200);
});

/* 调试钩子（自动化验证用） */
window.__ink={
  get state(){return state;},
  get focus(){return focusIdx;},
  panelShown:()=>UI.panel.classList.contains('show'),
  dbg:()=>({passes:composer.passes.map(p=>p.constructor.name),
    enabled:composer.passes.map(p=>p.enabled),
    rts:composer.passes.map(p=>!!p.renderToScreen),
    ink:gongbiPass.uniforms.uInk.value,
    time:gongbiPass.uniforms.uTime.value,
    res:gongbiPass.uniforms.uRes.value.x+'x'+gongbiPass.uniforms.uRes.value.y,
    prog:!!(gongbiPass.material&&gongbiPass.material.program)}),
  clickAt(nx,ny){ pointer.set(nx*innerWidth,ny*innerHeight); handleClick();
    return {state,panel:UI.panel.classList.contains('show')}; },
  pick(nx,ny){
    raycaster.setFromCamera(new THREE.Vector2(nx*2-1,-(ny*2-1)),camera);
    let list=hitTargets;
    if(state==='outside') list=hitTargets.filter(h=>h.userData.type==='door');
    else if(state==='inside') list=hitTargets.filter(h=>h.userData.type==='station'||h.userData.type==='door');
    else if(state==='focus') list=hitTargets.filter(h=>h.userData.type==='station');
    const hit=raycaster.intersectObjects(list,false)[0];
    return hit?hit.object.userData:null;
  },
  goto(idx){ focusStation(idx,true); return {state,focus:focusIdx}; },
  chop(){ return {rot:axeG?axeG.rotation.x:null, split:chopSplitS,
    x0:logHalves[0]?logHalves[0].position.x:null, x1:logHalves[1]?logHalves[1].position.x:null}; },
};
</script>
